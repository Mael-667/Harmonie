
services:
  web:
    build: .
    image: harmonie-app
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "symfony composer install --no-dev --optimize-autoloader &&
            php bin/console importmap:install &&
            php bin/console asset-map:compile &&
            php bin/console cache:warmup &&
            chown -R www-data:www-data var &&
            php bin/console doctrine:database:create --if-not-exists &&
            php bin/console doctrine:migrations:migrate --no-interaction &&
            apache2-foreground"
    volumes:
      - public-upload:/harmonie/public/uploads
    # env_file:
    #     - .env.prod
  websocket:
    image: harmonie-app
    command: sh -c "symfony composer install --no-dev --optimize-autoloader &&
                    php websocket/ChatWebsocket.php"
    # env_file:
    #   - .env.prod
    ports:
      - "443:8080"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:latest
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: harmonie_db 
    # ports:
        # - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
  public-upload:
